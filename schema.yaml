components:
  schemas:
    ActionEnum:
      enum:
      - trip.started
      - trip.ended
      - fare.changed
      - bus.maintenance_started
      - bus.maintenance_ended
      - route.updated
      - user.role_changed
      - user.suspended
      type: string
      description: |-
        * `trip.started` - Trip Started
        * `trip.ended` - Trip Ended
        * `fare.changed` - Fare Changed
        * `bus.maintenance_started` - Bus Maintenance Started
        * `bus.maintenance_ended` - Bus Maintenance Ended
        * `route.updated` - Route Updated
        * `user.role_changed` - User Role Changed
        * `user.suspended` - User Suspended
    ActorKindEnum:
      enum:
      - user
      - system
      - provider
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `provider` - Provider
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_role:
          type: string
          readOnly: true
        actor_kind:
          allOf:
          - $ref: '#/components/schemas/ActorKindEnum'
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_id
      - actor_kind
      - actor_role
      - created_at
      - entity_id
      - entity_type
      - id
      - metadata
    BusLiveState:
      type: object
      description: |-
        Formats the live bus state for map readers (Passengers and Admins).
        Adds two computed fields: age_seconds and is_stale.
      properties:
        bus:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        speed:
          type: number
          format: double
