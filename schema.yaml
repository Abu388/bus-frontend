openapi: 3.0.3
info:
  title: Bus Management System API
  version: 1.0.0
  description: API for Fleet, Routes, Fares, Trips, Live GPS Tracking, Payments, Tickets,
    and Auditing.
paths:
  /api/:
    get:
      operationId: api_list
      description: Retrieve fare history or filter for current active fares.
      summary: List fares
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: If true, returns only currently active fares (effective_to is
          null)
      - in: query
        name: route
        schema:
          type: string
          format: uuid
        description: Filter fares by Route UUID
      tags:
      - Fares
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fare'
          description: ''
    post:
      operationId: api_create
      description: Set a new fare for a route (Admin only). Automatically closes the
        previous active fare.
      summary: Configure a new route fare
      tags:
      - Fares
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fare'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fare'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fare'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
          description: ''
  /api/admin/audit/:
    get:
      operationId: api_admin_audit_list
      summary: View append-only system audit logs (Admin)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: entity_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/admin/buses/{id}/trips/:
    get:
      operationId: api_admin_buses_trips_list
      summary: Get all trips for a bus with passenger count and revenue (Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Reports & History
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusTripReportList'
          description: ''
  /api/admin/fares/history/:
    get:
      operationId: api_admin_fares_history_list
      summary: Get complete fare history across all routes with creator and timestamps
        (Admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Reports & History
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFareHistoryList'
          description: ''
  /api/admin/reports/summary/:
    get:
      operationId: api_admin_reports_summary_retrieve
      summary: Get revenue, passengers, and trip totals broken down by route, local
        day, and bus
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      tags:
      - Admin - Reports & History
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/trips/:
    get:
      operationId: api_admin_trips_list
      summary: Filter all trips with passenger count and revenue (Admin)
      parameters:
      - in: query
        name: bus
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: route
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - ended
      tags:
      - Admin - Reports & History
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusTripReportList'
          description: ''
  /api/buses/:
    get:
      operationId: api_buses_list
      description: Retrieve a list of all physical buses. Can be filtered by route
        or status.
      summary: List all physical buses
      parameters:
      - in: query
        name: route
        schema:
          type: string
          format: uuid
        description: Filter buses by Route UUID
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - maintenance
          - retired
        description: Filter buses by status
      tags:
      - Fleet - Buses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhysicalBus'
          description: ''
    post:
      operationId: api_buses_create
      description: Create a new physical bus (Admin only). Route assignment is optional.
      summary: Register a new physical bus
      tags:
      - Fleet - Buses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalBus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhysicalBus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhysicalBus'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalBus'
          description: ''
  /api/buses/{id}/:
    get:
      operationId: api_buses_retrieve
      description: Get details of a single physical bus by its UUID.
      summary: Retrieve a specific bus
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Buses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalBus'
          description: ''
    put:
      operationId: api_buses_update
      description: Full update of a physical bus (Admin only).
      summary: Update a physical bus
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Buses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalBus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhysicalBus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhysicalBus'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalBus'
          description: ''
    patch:
      operationId: api_buses_partial_update
      description: Update specific fields of a physical bus such as route or status
        (Admin only).
      summary: Partially update a physical bus
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Buses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPhysicalBus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPhysicalBus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPhysicalBus'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalBus'
          description: ''
    delete:
      operationId: api_buses_destroy
      description: Delete a physical bus if it has no maintenance history. Otherwise,
        set status to retired.
      summary: Delete a physical bus
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Buses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/buses/{id}/eta/:
    get:
      operationId: api_buses_eta_retrieve
      summary: Get next fermata and ETA for all upcoming stops
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tracking
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/buses/{id}/location/:
    get:
      operationId: api_buses_location_retrieve
      summary: Get last known location of a specific bus
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tracking
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusLiveState'
          description: ''
    post:
      operationId: api_buses_location_create
      description: Records GPS ping in history and updates live bus state if newer
        than existing state.
      summary: Send GPS ping from Cashier phone
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPingInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationPingInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationPingInput'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/buses/{id}/maintenance/:
    get:
      operationId: api_buses_maintenance_list
      summary: Get maintenance history for a bus (Admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Maintenance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceEvent'
          description: ''
    post:
      operationId: api_buses_maintenance_create
      description: Requires a reason. Rejected if the bus has an active trip or an
        open maintenance event. Sets bus status to maintenance, creates MaintenanceEvent,
        and writes an AuditLog row.
      summary: Send a bus into maintenance (Cashier / Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceStartInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaintenanceStartInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceStartInput'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEvent'
          description: ''
  /api/buses/{id}/resume/:
    post:
      operationId: api_buses_resume_create
      summary: Resume a bus from maintenance back to active (Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fleet - Maintenance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEvent'
          description: ''
  /api/buses/live/:
    get:
      operationId: api_buses_live_list
      description: Passengers receive buses with an active trip only. Admins receive
        all buses (including idle and maintenance).
      summary: Get all live buses
      tags:
      - Tracking
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusLiveState'
          description: ''
  /api/buses/search/:
    get:
      operationId: api_buses_search_list
      summary: Search live buses by public bus number
      parameters:
      - in: query
        name: number
        schema:
          type: integer
        description: Public bus number (e.g., 124)
        required: true
      tags:
      - Tracking
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusLiveState'
          description: ''
  /api/directions/:
    get:
      operationId: api_directions_list
      summary: List route directions (OSRM paths)
      tags:
      - Routes - Directions
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteDirection'
          description: ''
    post:
      operationId: api_directions_create
      summary: Create a route direction geometry
      tags:
      - Routes - Directions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteDirection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RouteDirection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RouteDirection'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDirection'
          description: ''
  /api/directions/{id}/:
    get:
      operationId: api_directions_retrieve
      summary: Retrieve route direction details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Directions
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDirection'
          description: ''
    put:
      operationId: api_directions_update
      summary: Update route direction data
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Directions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteDirection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RouteDirection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RouteDirection'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDirection'
          description: ''
    patch:
      operationId: api_directions_partial_update
      summary: Partially update route direction geometry/duration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Directions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRouteDirection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRouteDirection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRouteDirection'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDirection'
          description: ''
    delete:
      operationId: api_directions_destroy
      summary: Delete a route direction
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Directions
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/fermatas/:
    get:
      operationId: api_fermatas_list
      summary: List all fermatas
      tags:
      - Routes - Fermatas
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fermata'
          description: ''
    post:
      operationId: api_fermatas_create
      summary: Create a new fermata
      tags:
      - Routes - Fermatas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fermata'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fermata'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fermata'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fermata'
          description: ''
  /api/fermatas/{id}/:
    get:
      operationId: api_fermatas_retrieve
      summary: Retrieve a fermata
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Fermatas
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fermata'
          description: ''
    put:
      operationId: api_fermatas_update
      summary: Update a fermata
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Fermatas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fermata'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Fermata'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Fermata'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fermata'
          description: ''
    patch:
      operationId: api_fermatas_partial_update
      summary: Partially update a fermata
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Fermatas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFermata'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFermata'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFermata'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fermata'
          description: ''
    delete:
      operationId: api_fermatas_destroy
      summary: Delete a fermata (Protected if in use)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Routes - Fermatas
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: api_health_retrieve
      summary: Health check endpoint (verifies database connectivity)
      tags:
      - System
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/maintenance/:
    get:
      operationId: api_maintenance_list
      description: Retrieve maintenance logs (Accessible by Admin and Casher).
      summary: List maintenance events
      parameters:
      - in: query
        name: bus
        schema:
          type: string
          format: uuid
        description: Filter maintenance events by PhysicalBus UUID
      - in: query
        name: open
        schema:
          type: boolean
        description: If true, returns only currently open maintenance events (ended_at
          is null)
      tags:
      - Fleet - Maintenance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceEvent'
          description: ''
    post:
      operationId: api_maintenance_create
      description: Open a new maintenance event for a bus (Casher only). Automatically
        sets bus status to maintenance.
      summary: Start a maintenance event
      tags:
      - Fleet - Maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaintenanceEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceEvent'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceEvent'
          description: ''
